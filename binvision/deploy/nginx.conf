# BinVision Nginx site. Installed to /etc/nginx/sites-available/binvision by deploy/ec2_deploy.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/binvision;
    index index.html;

    # Uploads are capped at 5 MB by the app; allow a little multipart overhead.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths serve index.html so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
