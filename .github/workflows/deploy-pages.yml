
name: Deploy BinVision to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "binvision/frontend/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: binvision/frontend/package-lock.json

      - name: Install dependencies
        working-directory: binvision/frontend
        run: npm ci

      - name: Build frontend
        working-directory: binvision/frontend
        run: npm run build -- --base=/binvision/

      - name: Add SPA fallback
        working-directory: binvision/frontend
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: binvision/frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
